# Contrôles autoritaires de chaque PR (contrat, T18, T21 et section 3.1) : aucun hook Git local obligatoire.
# Actions épinglées par SHA ; permissions minimales ; aucun secret requis.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: Build, CSP et parcours sur trois moteurs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: pnpm de packageManager, intégrité comprise
        run: corepack enable && node -v && pnpm -v
      - run: pnpm install --frozen-lockfile
      - name: Une seule version de React et React DOM
        run: test "$(grep -oE "^  '?react(-dom)?@[0-9][^:(']*" pnpm-lock.yaml | sort -u | wc -l)" -eq 2
      - name: Audit high/critical, dépendances de build comprises
        run: pnpm audit --audit-level high
      - name: Audit de production, sans exception
        run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm tokens:check
      - name: Build en deux passes (CSP) et garde des chunks clients
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Parcours, CSP et axe sur Chromium, Firefox et WebKit
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
