s" x="118" y="1290" font-size="28" font-weight="600" fill="#271859" text-anchor="start"><tspan x="118" dy="0">Preuve publique</tspan></text><text class="sans" x="118" y="1340" font-size="18" font-weight="400" fill="#59358b" text-anchor="start"><tspan x="118" dy="0">Site en ligne, en neuf langues. Le lien prouve le déploiement,</tspan><tspan x="118" dy="26.099999999999998">pas à lui seul la contribution exacte de Russel.</tspan></text><text class="sans" x="118" y="1460" font-size="28" font-weight="600" fill="#271859" text-anchor="start"><tspan x="118" dy="0">Limite de droits</tspan></text><text class="sans" x="118" y="1510" font-size="18" font-weight="600" fill="#ed4459" text-anchor="start"><tspan x="118" dy="0">Aucune autorisation nommée de l’agence.</tspan></text><text class="sans caps" x="42" y="1740" font-size="8" fill="#59358b">DR-1 C3 · VUE DE CONTRÔLE · CONTENU RÉEL AVANT CANVAS</text></svg>